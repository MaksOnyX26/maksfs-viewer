name: MaksFS integration Windows x64 test

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Approve dependency downloads and one fresh Windows x64 test build and packaging attempt (up to 180 minutes)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: maksfs-first-windows-build
  cancel-in-progress: false

jobs:
  build:
    # This branch permits one explicitly confirmed attempt; reruns must not recompile.
    if: github.ref == 'refs/heads/codex/integration-windows-retest-20261111' && inputs.confirm_build && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SOURCE_SHA: c90b41cc62ef16e21bcb581b62f7f248d991c144
      WORKFLOW_SHA: ${{ github.sha }}
      AUTOBUILD_VSVER: '170'
      AUTOBUILD_ADDRSIZE: '64'
      AUTOBUILD_WIN_CMAKE_GEN: Visual Studio 17 2022
      AUTOBUILD_WIN_VSPLATFORM: x64
      AUTOBUILD_BUILD_ID: ${{ github.run_number }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      _CL_: /MP2
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact integration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c90b41cc62ef16e21bcb581b62f7f248d991c144
          persist-credentials: false
          fetch-depth: 0

      - name: Record build identity
        run: |
          New-Item -ItemType Directory -Path ci-logs -Force | Out-Null
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Unexpected binary source SHA' }
          if (git status --porcelain) { throw 'Source checkout must be clean before compilation' }
          @("Source: $env:SOURCE_SHA", "Workflow: $env:WORKFLOW_SHA", "Run: $env:GITHUB_RUN_ID", "Attempt: $env:GITHUB_RUN_ATTEMPT", 'Profile: ReleaseFS_open / x64 / Release', 'Channel: Firestorm-MaksFS-Experimental', 'Unsigned test artifacts only; no release publishing; Windows 11 runtime untested.') | Set-Content ci-logs/identity.txt

      - name: Select Python 3.11.9 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Prepare and verify tools on this runner
        timeout-minutes: 20
        run: ./ci/prepare-windows.ps1

      - name: Verify installed tools
        run: ./ci/verify-windows.ps1

      - name: Configure open profile and download dependencies
        timeout-minutes: 25
        run: |
          & cmd.exe /d /c ci\windows-build.cmd configure 2>&1 | Tee-Object ci-logs/configure.log
          if ($LASTEXITCODE -ne 0) { throw "Configuration failed with exit code $LASTEXITCODE" }
          ./ci/check-open-profile.ps1 -CachePath build-vc170-64/CMakeCache.txt

      - name: Compile without creating an installer
        timeout-minutes: 100
        run: |
          & cmd.exe /d /c ci\windows-build.cmd compile 2>&1 | Tee-Object ci-logs/compile.log
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed with exit code $LASTEXITCODE" }

      # Packaging controls come from this workflow revision, after the pinned source compiled.
      - name: Checkout test packaging controls only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .test-controls
          sparse-checkout: ci/packaging
          persist-credentials: false

      - name: Install packaging controls without changing viewer source
        run: |
          Copy-Item .test-controls/ci/packaging/*.py ci/packaging/ -Force
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source identity changed' }

      - name: Preserve fresh build inputs and provenance before packaging
        run: |
          python ci/packaging/snapshot.py
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot creation failed' }
          python -c "import zipfile; z=zipfile.ZipFile('ci-snapshot/packaging-inputs.zip'); z.extract('packaging-inputs.json', '.')"
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot provenance extraction failed' }
          (Get-FileHash ci-snapshot/packaging-inputs.zip -Algorithm SHA256).Hash.ToLowerInvariant() + '  packaging-inputs.zip' | Set-Content ci-snapshot/SHA256SUMS.txt
          Copy-Item packaging-inputs.json ci-snapshot/

      - name: Save fresh binary checkpoint even if later packaging fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maksfs-integration-fresh-inputs-${{ github.run_id }}
          path: ci-snapshot/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Install NSIS packaging tool
        timeout-minutes: 10
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }

      - name: Stage full upstream distribution from this build
        run: |
          & $env:MAKSFS_PYTHON ci/packaging/stage.py 2>&1 | Tee-Object ci-logs/stage.log
          if ($LASTEXITCODE -ne 0) { throw 'Distribution staging failed' }

      - name: Validate completeness and create test Setup EXE and Portable ZIP
        run: |
          python ci/packaging/package.py 2>&1 | Tee-Object ci-logs/package.log
          if ($LASTEXITCODE -ne 0) { throw 'Package validation/build failed' }

      - name: Verify installed hashes and preservation of user files
        run: ./ci/packaging/test-installer.ps1

      - name: Finalize checksums including the installer test report
        run: |
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content dist/SHA256SUMS.txt

      - name: Save test Setup EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MaksFS-integration-test-Setup-${{ github.run_id }}
          path: dist/*-Setup.exe
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Save test Portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MaksFS-integration-test-Portable-${{ github.run_id }}
          path: dist/*-Portable.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Save checksums and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MaksFS-integration-test-verification-${{ github.run_id }}
          path: |
            dist/*.json
            dist/*.txt
          retention-days: 30
          if-no-files-found: error

      - name: Save diagnostic logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maksfs-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ci-logs/
            dist/*.json
            dist/*.txt
            packaging-inputs.json
            package-work/MaksFS.nsi
            build-vc170-64/logs/
            build-vc170-64/CMakeCache.txt
            build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml
            build-vc170-64/packages-info.txt
            build-vc170-64/newview/viewer_version.txt

      - name: Record result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          "Build attempt: $env:BUILD_STATUS" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:SOURCE_SHA; workflow: $env:WORKFLOW_SHA; run: $env:GITHUB_RUN_ID" >> $env:GITHUB_STEP_SUMMARY
          'ReleaseFS_open, Windows x64, experimental channel. Fresh test artifacts only; no official release. See verification artifacts for SHA256 and completeness.' >> $env:GITHUB_STEP_SUMMARY
          'A successful compile is not a runtime test. FMOD/KDU/Havok are disabled; feature parity is not claimed.' >> $env:GITHUB_STEP_SUMMARY
