name: MaksFS toolchain preparation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maksfs-toolchain
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/maksfs-main'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      AUTOBUILD_VSVER: '170'
      AUTOBUILD_ADDRSIZE: '64'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read preparation scripts only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: ci

      - name: Select Python 3.11.9 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Install tools on the disposable runner
        run: ./ci/prepare-windows.ps1

      - name: Verify tools without configuring or compiling the viewer
        run: ./ci/verify-windows.ps1

      - name: Record final status
        if: always()
        env:
          PREPARATION_STATUS: ${{ job.status }}
        run: |
          "Preparation status: $env:PREPARATION_STATUS" >> $env:GITHUB_STEP_SUMMARY
          'This job does not build MaksFS. Viewer dependencies, compilation, packaging and publishing were not requested.' >> $env:GITHUB_STEP_SUMMARY
          'The runner is temporary: a future build must repeat this setup in its own job.' >> $env:GITHUB_STEP_SUMMARY
